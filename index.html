<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB to TXT Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #667eea;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .upload-hint {
            color: #999;
            font-size: 13px;
        }

        #fileInput {
            display: none;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            font-size: 14px;
        }

        .status.processing {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
            display: block;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .download-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            display: none;
            transition: transform 0.2s ease;
        }

        .download-btn:hover {
            transform: translateY(-2px);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .file-info {
            margin-top: 15px;
            padding: 10px;
            background: #f8f9ff;
            border-radius: 8px;
            font-size: 13px;
            color: #666;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 EPUB to TXT Converter</h1>
        <p class="subtitle">Convert your EPUB books to plain text format</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📤</div>
            <div class="upload-text">Click to upload or drag and drop</div>
            <div class="upload-hint">EPUB files only</div>
            <input type="file" id="fileInput" accept=".epub">
        </div>

        <div class="file-info" id="fileInfo"></div>
        <div class="spinner" id="spinner"></div>
        <div class="status" id="status"></div>
        <button class="download-btn" id="downloadBtn">⬇️ Download TXT File</button>
    </div>

    <script>
        let convertedText = '';
        let originalFileName = '';

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const downloadBtn = document.getElementById('downloadBtn');
        const spinner = document.getElementById('spinner');
        const fileInfo = document.getElementById('fileInfo');

        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.epub')) {
                handleFile(file);
            } else {
                showStatus('Please upload a valid EPUB file', 'error');
            }
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        // Download button
        downloadBtn.addEventListener('click', () => {
            const blob = new Blob([convertedText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = originalFileName.replace('.epub', '.txt');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        async function handleFile(file) {
            originalFileName = file.name;

            // Reset UI
            downloadBtn.style.display = 'none';
            status.className = 'status';
            fileInfo.style.display = 'block';
            fileInfo.textContent = `File: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;

            showStatus('Processing EPUB file...', 'processing');
            spinner.style.display = 'block';

            try {
                convertedText = await convertEpubToText(file);

                spinner.style.display = 'none';
                showStatus(`✓ Successfully converted! (${convertedText.length.toLocaleString()} characters)`, 'success');
                downloadBtn.style.display = 'block';
            } catch (error) {
                spinner.style.display = 'none';
                showStatus(`✗ Error: ${error.message}`, 'error');
                console.error(error);
            }
        }

        async function convertEpubToText(file) {
            const zip = new JSZip();
            const contents = await zip.loadAsync(file);

            // Find all content files (HTML/XHTML)
            const contentFiles = [];
            const opfFile = await findOPFFile(contents);

            if (opfFile) {
                // Parse OPF to get reading order
                const opfContent = await contents.file(opfFile).async('string');
                const parser = new DOMParser();
                const opfDoc = parser.parseFromString(opfContent, 'text/xml');

                // Get spine order
                const spineItems = opfDoc.querySelectorAll('spine itemref');
                const manifest = opfDoc.querySelectorAll('manifest item');

                // Build manifest map
                const manifestMap = {};
                manifest.forEach(item => {
                    manifestMap[item.getAttribute('id')] = item.getAttribute('href');
                });

                // Get files in reading order
                const opfDir = opfFile.substring(0, opfFile.lastIndexOf('/') + 1);
                spineItems.forEach(item => {
                    const idref = item.getAttribute('idref');
                    if (manifestMap[idref]) {
                        contentFiles.push(opfDir + manifestMap[idref]);
                    }
                });
            }

            // If no OPF found or spine is empty, fall back to finding HTML files
            if (contentFiles.length === 0) {
                Object.keys(contents.files).forEach(filename => {
                    if (filename.match(/\.(html|xhtml|htm)$/i) && !contents.files[filename].dir) {
                        contentFiles.push(filename);
                    }
                });
            }

            // Extract text from all content files
            let fullText = '';

            for (const filename of contentFiles) {
                const file = contents.file(filename);
                if (file) {
                    const content = await file.async('string');
                    const text = extractTextFromHTML(content);
                    fullText += text + '\n\n';
                }
            }

            return fullText.trim();
        }

        async function findOPFFile(zip) {
            // First check container.xml
            const containerFile = zip.file('META-INF/container.xml');
            if (containerFile) {
                const containerContent = await containerFile.async('string');
                const parser = new DOMParser();
                const containerDoc = parser.parseFromString(containerContent, 'text/xml');
                const rootfile = containerDoc.querySelector('rootfile');
                if (rootfile) {
                    return rootfile.getAttribute('full-path');
                }
            }

            // Fallback: search for .opf file
            for (const filename in zip.files) {
                if (filename.endsWith('.opf')) {
                    return filename;
                }
            }

            return null;
        }

        function extractTextFromHTML(html) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');

            // Remove script and style elements
            const scripts = doc.querySelectorAll('script, style');
            scripts.forEach(el => el.remove());

            // Get text content
            let text = doc.body ? doc.body.textContent : doc.textContent;

            // Clean up whitespace
            text = text.replace(/\s+/g, ' ').trim();
            text = text.replace(/\s*\n\s*/g, '\n');

            return text;
        }

        function showStatus(message, type) {
            status.textContent = message;
            status.className = `status ${type}`;
        }
    </script>
</body>
</html>
